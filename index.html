<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Loop</title><link rel="icon" id="fav">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root{
  color-scheme:dark;
  --bg:#07070a;--fg:#fff;--mut:#ffffff9e;--panel:#18181d;--line:#ffffff1a;
  --acc:#fe2c55;--cy:#25f4ee;--grad:linear-gradient(135deg,#fe2c55,#ff7a45);--glass:#ffffff14
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 30% 20%,#2a0f3a,#0b0b0d 60%);color:var(--fg);font:15px/1.4 system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}svg{width:24px;height:24px}
#app{width:100%;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:600px){body{display:grid;place-items:center}#app{width:420px;height:min(880px,calc(100dvh - 24px));border-radius:32px;border:1px solid #333;box-shadow:0 20px 80px #000a}}
main{flex:1;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;display:none;z-index:1}.view.on{display:block;z-index:2}

/* Feed & Videos */
#feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#111;overflow:hidden;display:grid;place-items:center}
.card video{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;z-index:1}
.v-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1f1f2e,#0b0b0f);color:#fff;text-align:center;padding:20px;z-index:0}
.shade{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(transparent,#000c);pointer-events:none;z-index:3}
.play{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:72px;opacity:0;pointer-events:none;color:#fff;transition:.15s;z-index:4}.card.paused .play{opacity:.65}
.burst{position:absolute;left:50%;top:45%;font-size:100px;color:var(--acc);opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.4);z-index:4}
.burst.go{animation:bu .5s linear}@keyframes bu{25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:center;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 22px;background:linear-gradient(#000b,transparent);color:#fff}
.logo{font-weight:900;font-size:21px;color:#fff;position:absolute;left:14px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px}
.logo.big{position:static;font-size:40px;background:linear-gradient(90deg,#9b27b0,#fe2c55);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:22px;font-weight:700;font-size:16px}.tabs button{opacity:.65;padding:4px 0;border-bottom:2px solid transparent;color:#fff}.tabs button.on{opacity:1;border-color:#fff}
#bMute{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:14px;background:#ffffff1f;backdrop-filter:blur(10px);border:1px solid #ffffff33;color:#fff;display:grid;place-items:center}
#bMute svg{width:20px;height:20px;fill:currentColor}#bMute.off{background:#fe2c55b3;border-color:#fe2c55}

.rail{position:absolute;right:8px;bottom:84px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff}
.rail>button{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;padding:0;color:#fff}
.rail>button svg{width:44px;height:44px;padding:9px;border-radius:50%;background:#0004;backdrop-filter:blur(8px);border:1px solid #ffffff1a;fill:currentColor}
.lk.on svg{fill:var(--acc)}.sv.on svg{fill:#ffc83d}.rpb.on-rp svg{fill:#25f4ee}
.avw{position:relative;margin-bottom:10px;cursor:pointer}
.av{width:48px;height:48px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden;flex:none;position:relative;color:#fff}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avw i{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:21px;height:21px;border-radius:50%;background:var(--acc);color:#fff;font-size:15px;font-weight:800;line-height:21px;text-align:center}
.info{position:absolute;left:14px;right:74px;bottom:14px;z-index:5;color:#fff}
.u-link{font-size:17px;font-weight:800;cursor:pointer;display:inline-block}
.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:3px 0 6px;cursor:pointer}.desc.open{-webkit-line-clamp:unset}
.ht{font-weight:700;cursor:pointer;color:#fff}
.mus{display:flex;gap:6px;overflow:hidden;white-space:nowrap;font-size:13px;cursor:pointer;padding:2px 0}
.mus span{display:inline-block;animation:mq 10s linear infinite}@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-55%)}}
.pg{position:absolute;left:0;bottom:0;height:3px;background:var(--grad);width:0;z-index:6}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--mut)}

/* Navigation */
nav{display:flex;align-items:center;background:#07070af2;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px 0 calc(5px + env(safe-area-inset-bottom,0px));z-index:20;position:relative}
nav button{flex:1;opacity:.62;font-size:11px;font-weight:500;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg)}
nav button.on{opacity:1;font-weight:700}
nav button svg{width:24px;height:24px}
.plus-pill{width:46px;height:30px;border-radius:9px;background:#fff;color:#000;display:grid;place-items:center;box-shadow:-3.5px 0 0 #25f4ee,3.5px 0 0 #fe2c55}
.plus-pill svg{width:18px;height:18px}
.bd{position:absolute;top:1px;left:56%;background:var(--acc);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;font-weight:700}

/* Allgemein & Listen */
.pad{padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}h2{margin:0 0 12px;font-size:24px;font-weight:800}
.btn,.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.btn.main{background:var(--grad);border:0;color:#fff;font-weight:700;box-shadow:0 4px 16px #fe2c5544}.chip.on{background:#fff;color:#000;font-weight:600}
input[type=text],textarea{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;margin-bottom:10px;outline:0}
textarea{resize:none;height:80px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.hint{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.tile{aspect-ratio:9/16;background:#1c1c22;position:relative;cursor:pointer;overflow:hidden;border-radius:4px}
.tile video{width:100%;height:100%;object-fit:cover}.tile span{position:absolute;left:6px;bottom:5px;font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;gap:3px}
.li{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--glass);margin-bottom:8px}.li .av{width:42px;height:42px;font-size:16px;border:0}.li>div:nth-child(2){flex:1;min-width:0}.li small{display:block;color:var(--mut)}
.sh3{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin:18px 0 6px;font-weight:700}

/* Profil im TikTok-Look */
#mp{padding-bottom:24px}
.pban{height:145px;position:relative;background:linear-gradient(135deg,#3b1259,#8e2de2 45%,#fe2c55);background-size:cover;background-position:center;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0}
.pban::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--bg));pointer-events:none}
.top-actions{display:flex;gap:10px;position:relative;z-index:2}
.rb{width:36px;height:36px;border-radius:50%;background:#0006;backdrop-filter:blur(10px);border:1px solid #ffffff22;display:grid;place-items:center;color:#fff;cursor:pointer}
.rb svg{width:18px;height:18px;fill:currentColor}

.p-header-section{text-align:center;position:relative;z-index:2;margin-top:-35px;padding:0 16px}
.pav-big{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;border:3px solid var(--bg);position:relative;background:#222;overflow:hidden;cursor:pointer}
.pav-big img{width:100%;height:100%;object-fit:cover}
.pav-big .badge-plus{position:absolute;right:2px;bottom:2px;width:24px;height:24px;background:var(--acc);border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px;border:2px solid var(--bg)}

.pname-main{font-size:20px;font-weight:800;margin-bottom:2px}
.phandle{font-size:14px;color:var(--mut);margin-bottom:12px}

.stats-row{display:flex;justify-content:center;gap:24px;margin-bottom:14px;font-size:14px;color:var(--mut)}
.stats-row div{text-align:center;cursor:pointer}
.stats-row b{display:block;font-size:17px;font-weight:800;color:var(--fg)}

.profile-actions{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.profile-actions button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 20px;font-weight:600;font-size:14px}
.profile-actions button.primary{background:var(--acc);border:0;color:#fff}

.p-bio{font-size:13px;line-height:1.4;margin-bottom:6px;white-space:pre-line}
.p-web{color:var(--cy);font-weight:600;font-size:13px;text-decoration:none;display:inline-block;margin-bottom:14px}

.ptabs-bar{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
.ptabs-bar button{flex:1;background:none;border:0;padding:10px 0;opacity:.4;display:flex;justify-content:center;align-items:center;border-bottom:2px solid transparent}
.ptabs-bar button svg{width:22px;height:22px;fill:currentColor}
.ptabs-bar button.on{opacity:1;border-color:var(--fg)}

/* Sheets & Splash */
#ov{position:absolute;inset:0;z-index:100;display:none;background:#0008;backdrop-filter:blur(4px);align-items:flex-end}#ov.on{display:flex}
#sh{width:100%;max-height:86%;overflow-y:auto;background:#141418;border-radius:20px 20px 0 0;padding:18px;animation:up .2s ease-out;z-index:101}
@keyframes up{from{transform:translateY(100%)}}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;z-index:200;transition:.2s}#toast.on{opacity:1}
#splash{position:absolute;inset:0;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 30%,#3b1250,#07070a 70%);text-align:center;padding:30px;color:#fff}
#splash p{color:#ffffff9e;margin:0 0 10px}#splash .btn{font-size:17px;padding:13px 30px}
.lg.big{height:125px;width:auto;filter:drop-shadow(0 0 34px #9b27b0aa)}
.gbtn{background:#fff;color:#111;border:0;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:center;width:270px;box-shadow:0 6px 20px #0005}.gbtn svg{width:20px;height:20px}
#splash .btn.main{width:270px}
</style></head>
<body>
<div id="app">
 <div id="toast"></div>
 <div id="splash">
  <img class="lg big" alt="">
  <div class="logo big">Loop</div>
  <p>Kurze Videos. Deine Bühne.</p>
  <button class="btn gbtn" id="gsign">
   <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
   <span>Mit Google anmelden</span>
  </button>
  <button class="btn main" id="go">▶ Als Gast starten</button>
 </div>

 <main>
  <section id="home" class="view on">
   <div class="top">
    <div class="logo"><img class="lg" alt="">Loop</div>
    <div class="tabs"><button id="tF">Folge ich</button><button id="tY" class="on">Für dich</button></div>
    <button id="bMute" aria-label="Ton"></button>
   </div>
   <div id="feed"></div>
  </section>

  <section id="disc" class="view">
   <div class="pad">
    <h2>Entdecken</h2>
    <input type="text" id="q" placeholder="Videos suchen…">
    <div class="row" id="chips"></div>
    <h3 class="sh3">Videos</h3><div class="hint" id="qs"></div>
    <div class="grid" id="qg"></div>
   </div>
  </section>

  <section id="inbox" class="view">
   <div class="pad">
    <h2>Posteingang</h2>
    <div id="ip"></div>
   </div>
  </section>

  <section id="me" class="view">
   <div id="mp"></div>
  </section>

  <div id="ov"><div id="sh"></div></div>
 </main>

 <nav>
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20v-9.5z"/><path d="M12 13v4"/></svg>Start</button>
  <button data-v="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Entdecken</button>
  <button data-v="plus" class="plus"><span class="plus-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-v="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>Posteingang</button>
  <button data-v="me"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="4"/><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5v1H4v-1z"/></svg>Profil</button>
 </nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithRedirect, GoogleAuthProvider, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCAdlZys-UbFqGppbpPW5y3kBtWzq4_CZw",
  authDomain: "loopapp-51081.firebaseapp.com",
  projectId: "loopapp-51081",
  storageBucket: "loopapp-51081.firebasestorage.app",
  messagingSenderId: "1017277013709",
  appId: "1:1017277013709:web:ecccd39689e00536e61384",
  measurementId: "G-J29NMNXSRP"
};

let auth, db, storage, provider;
let firebaseReady = false;
try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  storage = getStorage(app);
  provider = new GoogleAuthProvider();
  firebaseReady = true;
} catch (e) { console.error("Firebase Init Error:", e); }

const S = {
  uid: null, name: "Gast", user: "@gast", bio: "Willkommen auf Loop ✨\nDeine kurze Bühne für Videos.", website: "https://liebigpaul-star.github.io/Loop/", av: "",
  fol: ["@lena.dance"], likes: {}, saves: {}, coms: {},
  cloudVideos: [], tab: "y", muted: true, light: false
};

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const toast=t=>{const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),2500)};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":String(n);

const LOGO="data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><path d="M74 22c7.5 0 13.5 6 13.5 13.5 0 4.3-2 8.1-5.1 10.6l-1.5 1.2 4.3 2.5c5.7 3.3 9.3 9.4 9.3 16 0 5.3-2.3 10.3-6.2 13.8L63 101c-6.8 6-17.2 5.4-23.2-1.4-6-6.8-5.4-17.2 1.4-23.2l4.4-3.9-4.3-2.5C35.6 66.7 32 60.6 32 54c0-5.3 2.3-10.3 6.2-13.8L63.5 18c2.9-2.6 6.6-4 10.5-4z" fill="#9b26b6"/><polygon points="53,45 53,75 79,60" fill="#ffffff"/></svg>`);
$$(".lg").forEach(i=>i.src=LOGO); $("#fav").href=LOGO;

const IC={
 heart:`<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
 com:`<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>`,
 share:`<svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>`,
 son:`<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`,
 soff:`<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`
};

const DEFAULT_VIDEOS = [
 {id:"v1",u:"@lena.dance",n:"Lena",c:"#fe2c55",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",desc:"Late night energy ✨ #dance #vibes #loop",mus:"Originalton - Lena",lk:1420},
 {id:"v2",u:"@oceanvibes",n:"Ocean Vibes",c:"#25f4ee",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",desc:"Einfach mal abschalten 🌊 #ocean #chill",mus:"Chill Waves",lk:8930},
 {id:"v3",u:"@max.beats",n:"Max Beats",c:"#9b27b0",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",desc:"Neuer Sound im Studio 🔥 #music #beats",mus:"Midnight Riff",lk:4320}
];

async function loadCloudVideos() {
  if (!firebaseReady) return;
  try {
    const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    S.cloudVideos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderFeed();
  } catch (e) { console.error("Fehler beim Laden:", e); }
}

function allVideos() {
  return [...S.cloudVideos, ...DEFAULT_VIDEOS];
}

if (firebaseReady) {
  getRedirectResult(auth).then(async (res) => {
    if (res) {
      const u = res.user;
      S.uid = u.uid;
      S.name = u.displayName || "Loop User";
      S.user = "@" + (u.email.split("@")[0]).toLowerCase();
      S.av = u.photoURL || "";
      $("#splash").style.display = "none";
      toast("Willkommen, " + S.name + "! 🎉");
      await loadCloudVideos();
      renderFeed();
    }
  }).catch((err) => { toast("Login-Fehler: " + err.message); });
}

$("#gsign").onclick = async () => {
  if (!firebaseReady) { toast("Firebase nicht bereit!"); return; }
  try { await signInWithRedirect(auth, provider); } catch (err) { toast("Login fehlgeschlagen: " + err.message); }
};

$("#go").onclick = async () => {
  $("#splash").style.display = "none";
  await loadCloudVideos();
  renderFeed();
};

if (firebaseReady) {
  onAuthStateChanged(auth, async (u) => {
    if (u) {
      S.uid = u.uid;
      S.name = u.displayName || "Loop User";
      S.user = "@" + (u.email.split("@")[0]).toLowerCase();
      S.av = u.photoURL || "";
      $("#splash").style.display = "none";
      await loadCloudVideos();
      renderFeed();
    }
  });
}

function renderFeed() {
  const f = $("#feed");
  let list = allVideos();
  if (S.tab === "f") list = list.filter(v => S.fol.includes(v.u));
  if (!list.length) {
    f.innerHTML = `<div class="empty"><div><h3>Noch nichts hier</h3><p>Folge Creators im „Für dich“-Tab.</p></div></div>`;
    return;
  }
  f.innerHTML = list.map(v => {
    const isL = !!S.likes[v.id];
    const isF = S.fol.includes(v.u) || v.u === S.user;
    return `<div class="card" data-id="${v.id}">
      <div class="v-fallback"><div style="font-size:32px">🎬</div><div>Video lädt…</div></div>
      <video src="${v.src}" loop playsinline webkit-playsinline preload="metadata" ${S.muted ? "muted" : ""}></video>
      <div class="shade"></div><div class="play">▶</div><div class="burst">♥</div><div class="pg"></div>
      <div class="rail">
        <div class="avw">
          <div class="av" style="background:${v.c||'#fe2c55'}">${v.av?`<img src="${v.av}">`:`<span>${(v.n||v.u)[0].toUpperCase()}</span>`}</div>
          ${v.u===S.user?"":`<i data-fol="${v.u}">${isF?"✓":"+"}</i>`}
        </div>
        <button class="lk ${isL?"on":""}" data-lk="${v.id}">${IC.heart}<span>${fmt((v.lk||0)+(isL?1:0))}</span></button>
        <button data-sh="${v.id}">${IC.share}<span>Teilen</span></button>
      </div>
      <div class="info">
        <span class="u-link">${v.u}</span>
        <div class="desc">${v.desc||""}</div>
        <div class="mus">🎵 <span>${v.mus||"Originalton"} &nbsp;&nbsp; 🎵 ${v.mus||"Originalton"}</span></div>
      </div>
    </div>`;
  }).join("");
  setupObservers();
}

function setupObservers() {
  const cards = $$(".card");
  const io = new IntersectionObserver(es => {
    es.forEach(e => {
      const vid = e.target.querySelector("video");
      if (!vid) return;
      if (e.isIntersecting) {
        vid.muted = S.muted;
        vid.play().catch(() => { vid.muted = true; vid.play().catch(()=>{}); });
        e.target.classList.remove("paused");
      } else { vid.pause(); vid.currentTime = 0; }
    });
  }, { root: $("#feed"), threshold: 0.55 });

  cards.forEach(c => {
    io.observe(c);
    const vid = c.querySelector("video"), pg = c.querySelector(".pg");
    vid.ontimeupdate = () => { if (vid.duration) pg.style.width = (vid.currentTime / vid.duration * 100) + "%"; };
    c.onclick = ev => {
      if (ev.target.closest("button,.avw")) return;
      if (vid.paused) { vid.play(); c.classList.remove("paused"); }
      else { vid.pause(); c.classList.add("paused"); }
    };
  });
}

function updMute() {
  const b = $("#bMute");
  b.innerHTML = S.muted ? IC.soff : IC.son;
  b.classList.toggle("off", S.muted);
  $$("video").forEach(v => v.muted = S.muted);
}
updMute();
$("#bMute").onclick = () => { S.muted = !S.muted; updMute(); };
$("#tF").onclick = () => { S.tab = "f"; $("#tF").classList.add("on"); $("#tY").classList.remove("on"); renderFeed(); };
$("#tY").onclick = () => { S.tab = "y"; $("#tY").classList.add("on"); $("#tF").classList.remove("on"); renderFeed(); };

document.addEventListener("click", e => {
  const fol = e.target.closest("[data-fol]");
  if (fol) {
    const u = fol.dataset.fol;
    const i = S.fol.indexOf(u);
    if (i >= 0) S.fol.splice(i, 1); else S.fol.push(u);
    renderFeed(); return;
  }
  const lk = e.target.closest("[data-lk]");
  if (lk) { S.likes[lk.dataset.lk] = !S.likes[lk.dataset.lk]; renderFeed(); return; }
  const sh = e.target.closest("[data-sh]");
  if (sh) {
    const url = window.location.origin + window.location.pathname + "?user=" + encodeURIComponent(S.user);
    navigator.clipboard?.writeText(url);
    toast("Profil-Link kopiert! 🔗");
  }
});

function openCreator() {
  if (!S.uid) { toast("Bitte melde dich zuerst mit Google an, um Videos hochzuladen!"); return; }
  openSheet(`<h3>Neues Video in die Cloud posten</h3>
    <button class="btn" id="pickVid" style="width:100%;margin-bottom:10px">🎬 MP4-Video auswählen</button>
    <input type="file" id="vf" accept="video/mp4,video/quicktime" hidden>
    <input type="text" id="vDesc" placeholder="Beschreibung & Hashtags…">
    <button class="btn main" id="vPost" style="width:100%">Veröffentlichen</button>
  `);
  let selectedFile = null;
  $("#pickVid").onclick = () => $("#vf").click();
  $("#vf").onchange = e => {
    selectedFile = e.target.files[0];
    if (selectedFile) $("#pickVid").textContent = "✓ " + selectedFile.name;
  };
  $("#vPost").onclick = async () => {
    if (!selectedFile) { toast("Bitte wähle ein Video aus!"); return; }
    $("#vPost").textContent = "Lädt hoch… bitte warten ⏳";
    $("#vPost").disabled = true;
    try {
      const fileRef = ref(storage, `videos/${S.uid}_${Date.now()}_${selectedFile.name}`);
      await uploadBytes(fileRef, selectedFile);
      const downloadURL = await getDownloadURL(fileRef);

      await addDoc(collection(db, "videos"), {
        u: S.user, n: S.name, av: S.av, c: "#fe2c55",
        src: downloadURL, desc: $("#vDesc").value || "Neuer Loop ✨",
        mus: "Originalton - " + S.name, lk: 1, createdAt: Date.now()
      });

      closeSheet();
      toast("Video ist jetzt für alle live! 🚀");
      await loadCloudVideos();
      goView("home");
    } catch (err) {
      toast("Upload-Fehler: " + err.message);
      $("#vPost").textContent = "Veröffentlichen";
      $("#vPost").disabled = false;
    }
  };
}

function renderProfile() {
  const myVids = allVideos().filter(v => v.u === S.user);
  const shareUrl = window.location.origin + window.location.pathname + "?user=" + encodeURIComponent(S.user);
  
  $("#mp").innerHTML = `
    <div class="pban">
      <div class="top-actions">
        <div class="rb" id="bEditProf" title="Profil bearbeiten">✏️</div>
      </div>
      <div class="top-actions">
        ${S.uid ? `<div class="rb" id="bLogout" title="Abmelden">🚪</div>` : ""}
      </div>
    </div>
    
    <div class="p-header-section">
      <div class="pav-big" id="changeAvatar">
        ${S.av ? `<img src="${S.av}">` : `<div style="display:grid;place-items:center;height:100%;font-size:36px;font-weight:800">${S.name[0].toUpperCase()}</div>`}
        <div class="badge-plus">+</div>
      </div>
      <div class="pname-main">${S.name}</div>
      <div class="phandle">${S.user}</div>

      <div class="stats-row">
        <div><b>${S.fol.length}</b>Following</div>
        <div><b>${myVids.length * 248}</b>Followers</div>
        <div><b>${myVids.reduce((a,b)=>a+(b.lk||1), 0)}</b>Likes</div>
      </div>

      <div class="profile-actions">
        <button class="primary" id="bShareProf">Profil teilen</button>
        <button id="bAddLink">Webseite hinzufügen</button>
      </div>

      <div class="p-bio">${S.bio}</div>
      ${S.website ? `<a class="p-web" href="${S.website}" target="_blank">🔗 ${S.website}</a>` : ""}
    </div>

    <div class="ptabs-bar">
      <button class="on"><svg viewBox="0 0 24 24"><path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/></svg></button>
      <button><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
      <button><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg></button>
    </div>

    <div class="grid" style="margin-top:2px">${myVids.map(v=>`<div class="tile"><video src="${v.src}" muted playsinline preload="metadata"></video><span>▷ ${fmt(v.lk||1)}</span></div>`).join("")}</div>
  `;

  $("#bShareProf").onclick = () => {
    navigator.clipboard?.writeText(shareUrl);
    toast("Profil-Link kopiert! 🔗");
  };

  $("#bEditProf").onclick = () => {
    openSheet(`<h3>Profil bearbeiten</h3>
      <label class="hint">Name</label>
      <input type="text" id="eName" value="${S.name}">
      <label class="hint">Bio</label>
      <textarea id="eBio">${S.bio}</textarea>
      <button class="btn main" id="saveProf" style="width:100%;margin-top:10px">Speichern</button>
    `);
    $("#saveProf").onclick = () => {
      S.name = $("#eName").value || S.name;
      S.bio = $("#eBio").value;
      closeSheet();
      renderProfile();
      toast("Profil aktualisiert! ✨");
    };
  };

  $("#bAddLink").onclick = () => {
    openSheet(`<h3>Webseite verlinken</h3>
      <input type="text" id="eWeb" value="${S.website || ''}" placeholder="https://deine-website.de">
      <button class="btn main" id="saveWeb" style="width:100%;margin-top:10px">Link setzen</button>
    `);
    $("#saveWeb").onclick = () => {
      S.website = $("#eWeb").value;
      closeSheet();
      renderProfile();
      toast("Webseite aktualisiert! 🔗");
    };
  };

  if ($("#bLogout")) {
    $("#bLogout").onclick = async () => { await signOut(auth); location.reload(); };
  }
}

function openSheet(html) { $("#sh").innerHTML = html; $("#ov").classList.add("on"); }
function closeSheet() { $("#ov").classList.remove("on"); }
$("#ov").onclick = e => { if (e.target === $("#ov")) closeSheet(); };

function goView(v) {
  closeSheet();
  if (v === "plus") { openCreator(); return; }
  $$(".view").forEach(x => x.classList.remove("on"));
  $("#" + v).classList.add("on");
  $$("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if (v === "home") renderFeed();
  if (v === "disc") $("#qg").innerHTML = allVideos().map(v=>`<div class="tile"><video src="${v.src}" muted playsinline preload="metadata"></video><span>▷ ${fmt(v.lk||1)}</span></div>`).join("");
  if (v === "me") renderProfile();
}

$$("nav button").forEach(b => b.onclick = () => goView(b.dataset.v));
</script>
